<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter Reader</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: Arial, sans-serif;
    }

    button { font: inherit; border: 0; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #toggle-navbar {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      padding: 9px 13px;
      background: #6366f1;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    #toggle-navbar:hover { background: #4f46e5; }

    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      width: 100%;
      background: #fff;
      box-shadow: 0 4px 10px rgb(0 0 0 / 15%);
      transition: transform .3s ease;
    }

    #navbar.navbar-hidden { transform: translateY(-100%); }

    .options {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      padding-right: 70px;
    }

    #prev-chapter, #next-chapter {
      padding: 9px 13px;
      border-radius: 6px;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    #prev-chapter:hover, #next-chapter:hover { background: #4f46e5; }

    #size-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .size-button {
      padding: 9px 13px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    .size-button:hover { background: #2563eb; }

    .size-button.active {
      background: #1d4ed8;
      outline: 2px solid #93c5fd;
      outline-offset: 1px;
    }

    .wrapper {
      width: 50%;
      margin: 0 auto;
      padding-top: 100px;
      font-size: 0;
      line-height: 0;
    }

    .chapter-image {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      vertical-align: top;
    }

    @media (max-width: 768px) {
      #toggle-navbar { top: 10px; right: 10px; }
      .options { gap: 8px; padding: 12px; padding-top: 60px; }
      .size-controls { gap: 6px; }
      .size-button { padding: 7px 10px; }
      #prev-chapter, #next-chapter { padding: 8px 10px; }
      .wrapper { padding-top: 180px; }
    }

    @media (max-width: 400px) {
      .options { gap: 7px; }
      .wrapper { width: 50%; }
    }
  </style>
</head>
<body>
  <button id="toggle-navbar" type="button" aria-label="Toggle navbar" aria-expanded="true">☰</button>

  <div id="navbar">
    <div class="options">
      <button id="prev-chapter" type="button">◀ Prev</button>
      <button id="next-chapter" type="button">Next ▶</button>
      <div id="size-controls"></div>
    </div>
  </div>

  <main class="wrapper"></main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.querySelector(".wrapper");
      const navbar = document.getElementById("navbar");
      const toggleBtn = document.getElementById("toggle-navbar");
      const sizeControls = document.getElementById("size-controls");

      let isNavbarOpen = true;

      // Toggle navbar
      toggleBtn.addEventListener("click", () => {
        isNavbarOpen = !isNavbarOpen;
        navbar.classList.toggle("navbar-hidden", !isNavbarOpen);
        toggleBtn.textContent = isNavbarOpen ? "☰" : "✕";
        toggleBtn.setAttribute("aria-expanded", String(isNavbarOpen));
      });

      // Navigasi chapter
      function changeChapter(delta) {
        const path = window.location.pathname;
        const match = path.match(/chapter_(\d+)/i);

        if (!match) {
          alert("Chapter tidak ditemukan di URL!");
          return;
        }

        const currentNumber = match[1];
        const newNumber = Number(currentNumber) + delta;
        if (newNumber < 1) return;

        const paddedNumber = String(newNumber).padStart(currentNumber.length, "0");
        window.location.pathname = path.replace(/chapter_\d+/i, `chapter_${paddedNumber}`);
      }

      document.getElementById("prev-chapter").addEventListener("click", () => changeChapter(-1));
      document.getElementById("next-chapter").addEventListener("click", () => changeChapter(1));

      // Pengaturan lebar gambar: default 5 = 50%
      const sizes = [
        { label: "5", width: "50%" },
        { label: "6", width: "60%" },
        { label: "7", width: "70%" },
        { label: "8", width: "80%" },
        { label: "9", width: "90%" },
        { label: "10", width: "100%" }
      ];

      sizes.forEach(({ label, width }) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.className = "size-button";
        button.setAttribute("aria-label", `Lebar gambar ${width}`);

        if (label === "5") button.classList.add("active");

        button.addEventListener("click", () => {
          wrapper.style.width = width;
          sizeControls.querySelectorAll(".size-button").forEach(item => {
            item.classList.toggle("active", item === button);
          });
        });

        sizeControls.appendChild(button);
      });

      // Memeriksa beberapa nomor sekaligus, tetapi menampilkan gambar sesuai urutan.
      function getCandidates(number) {
        return [...new Set([
          String(number).padStart(3, "0") + ".jpg",
          String(number).padStart(2, "0") + ".jpg",
          number + ".jpg"
        ])];
      }

      function loadImage(number) {
        const candidates = getCandidates(number);

        return new Promise(resolve => {
          let candidateIndex = 0;

          function tryCandidate() {
            if (candidateIndex >= candidates.length) {
              resolve(null);
              return;
            }

            const img = new Image();
            img.className = "chapter-image";
            img.alt = `Halaman ${number}`;
            img.onload = () => resolve(img);
            img.onerror = () => {
              candidateIndex++;
              tryCandidate();
            };
            img.src = "./" + candidates[candidateIndex];
          }

          tryCandidate();
        });
      }

      async function loadImages() {
        wrapper.replaceChildren();

        const batchSize = 8;
        const maxEmptyBatch = 2;
        let currentNumber = 1;
        let emptyBatches = 0;
        let loading = true;

        while (loading) {
          const numbers = Array.from({ length: batchSize }, (_, i) => currentNumber + i);
          const results = await Promise.all(numbers.map(loadImage));
          const loadedCount = results.filter(Boolean).length;

          // Berhenti jika dua kelompok berturut-turut tidak menemukan gambar.
          if (loadedCount === 0) {
            emptyBatches++;
            if (emptyBatches >= maxEmptyBatch) break;
          } else {
            emptyBatches = 0;
          }

          // Promise.all menjaga urutan hasil sesuai nomor halaman.
          results.forEach(img => {
            if (img) wrapper.appendChild(img);
          });

          currentNumber += batchSize;
        }
      }

      loadImages().catch(error => console.error("Gagal memuat gambar:", error));
    });
  </script>
</body>
</html>
